<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChemGraf</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f0f0f0; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #status { position: fixed; left: 10px; bottom: 8px; font: 12px system-ui, sans-serif;
            color: #666; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">loading the editor…</div>
<script src="chemgraf.js"></script>
<script>
/* ChemGraf Web Editor — host page and window-level API (PLAN-WEB-EDITOR §5).
 *
 * Embed as one iframe:  <iframe src="chemgraf-web/index.html?mode=mol">
 * (mode=rxn for a reaction). The iframe's window then exposes, in the
 * shape the ELN's own editor uses:
 *   setMolRxnfile(text)  load a molfile (mode mol) or rxnfile (mode rxn); "" clears
 *   getMolRxnfile()      the drawing as molfile / rxnfile (V2000 unless V3000 is needed)
 *   getSmiles()          the drawing as SMILES (CXSMILES with enhanced stereo)
 *   addTemplate(molfile) host template (recorded; not in the menu yet)
 *   isReady              true once the editor runs
 * plus setCdxml(xml) / getCdxml() / getSvg() / getLastError(), and a
 * 'chemgraf-ready' event on the window when isReady turns true.
 */
(function () {
  var params = new URLSearchParams(location.search);
  var mode = params.get('mode') === 'rxn' ? 'rxn' : 'mol';
  var canvas = document.getElementById('canvas');
  var status = document.getElementById('status');
  var M = null;

  function str(fn) { return M ? M.ccall(fn, 'string', [], []) : ''; }
  function put(fn, arg) { return !!M && M.ccall(fn, 'number', ['string'], [arg || '']) === 1; }

  window.isReady = false;
  window.chemgrafMode = mode;
  window.setMolRxnfile = function (t) { return put('chemgraf_web_set_molrxn', t); };
  window.getMolRxnfile = function () { return str('chemgraf_web_get_molrxn'); };
  window.getSmiles = function () { return str('chemgraf_web_get_smiles'); };
  window.setCdxml = function (x) { return put('chemgraf_web_set_cdxml', x); };
  window.getCdxml = function () { return str('chemgraf_web_get_cdxml'); };
  window.getSvg = function () { return str('chemgraf_web_get_svg'); };
  window.addTemplate = function (m) { return put('chemgraf_web_add_template', m); };
  window.getLastError = function () { return str('chemgraf_web_last_error'); };

  createChemGraf({
    canvas: canvas,
    print: function (t) { console.log(t); },
    printErr: function (t) { console.error(t); },
    setStatus: function (t) { status.textContent = t; }
  }).then(function (mod) {
    M = mod;
    M.ccall('chemgraf_web_set_mode', null, ['string'], [mode]);
    function resize() {
      M.ccall('chemgraf_web_resize', null, ['number', 'number'],
              [window.innerWidth | 0, window.innerHeight | 0]);
    }
    window.addEventListener('resize', resize);
    resize();
    // The browser hands clipboard content over in the paste event, which
    // fires in the same task as the Ctrl+V keydown — before the animation
    // frame in which the editor handles the key. Prime the editor's slot.
    document.addEventListener('paste', function (e) {
      var cd = e.clipboardData;
      if (!cd) return;
      M.ccall('chemgraf_web_paste', null, ['string', 'string'],
              [cd.getData('text/plain') || '', cd.getData('text/html') || '']);
      e.preventDefault();
    });
    // A dropped file lands on the canvas as the desktop's drag-and-drop
    // would: through the same loaders, by extension.
    canvas.addEventListener('dragover', function (e) { e.preventDefault(); });
    canvas.addEventListener('drop', function (e) {
      e.preventDefault();
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (!f) return;
      f.text().then(function (txt) {
        var name = (f.name || '').toLowerCase();
        if (/\.(cdxml)$/.test(name)) window.setCdxml(txt);
        else window.setMolRxnfile(txt);
      });
    });
    // Soft keyboard (touch screens only): a phone raises its keyboard for
    // a focused text field and nothing else, so a hidden <input> stands in
    // whenever the editor wants text (a caption, an atom label, the SMILES
    // box). What the keyboard produces is diffed against what was already
    // sent — a phone's IME rewrites words — and goes in as characters and
    // Backspaces; the key events stop at the input so SDL's window
    // listener never sees them a second time.
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
      var kb = document.createElement('input');
      kb.type = 'text';
      kb.setAttribute('autocomplete', 'off');
      kb.setAttribute('autocorrect', 'off');
      kb.setAttribute('autocapitalize', 'off');
      kb.spellcheck = false;
      kb.style.cssText = 'position:fixed;left:0;bottom:0;width:1px;height:1px;' +
                         'opacity:0.01;border:0;padding:0;font-size:16px;';
      document.body.appendChild(kb);
      var SENT = '  ';   // a stub so Backspace always has a character to eat
      var sent = '';
      function kbReset() {
        sent = '';
        kb.value = SENT;
        try { kb.setSelectionRange(SENT.length, SENT.length); } catch (e) {}
      }
      function wantsKb() { return M.ccall('chemgraf_web_wants_keyboard', 'number', [], []) === 1; }
      function key(name) { M.ccall('chemgraf_web_key', null, ['string'], [name]); }
      kbReset();
      kb.addEventListener('input', function () {
        var v = kb.value;
        if (v.slice(0, SENT.length) !== SENT) {   // deleted into the stub
          key('Backspace');
          kbReset();
          return;
        }
        var t = v.slice(SENT.length), p = 0;
        while (p < t.length && p < sent.length && t.charAt(p) === sent.charAt(p)) p++;
        for (var i = sent.length; i > p; i--) key('Backspace');
        if (t.length > p) M.ccall('chemgraf_web_text_input', null, ['string'], [t.slice(p)]);
        sent = t;
      });
      var keyNames = {Enter: 'Return', Escape: 'Escape', ArrowLeft: 'Left', ArrowRight: 'Right',
                      ArrowUp: 'Up', ArrowDown: 'Down', Tab: 'Tab', Home: 'Home', End: 'End'};
      kb.addEventListener('keydown', function (e) {
        e.stopPropagation();
        if (keyNames[e.key]) {
          key(keyNames[e.key]);
          if (e.key === 'Enter' || e.key === 'Escape') kbReset();
          e.preventDefault();
        }
      });
      kb.addEventListener('keyup', function (e) { e.stopPropagation(); });
      kb.addEventListener('keypress', function (e) { e.stopPropagation(); });
      // iOS raises the keyboard only from inside a touch handler, so the
      // tap that lands on a text field is where the focus happens; the
      // poll below covers Android and puts the focus back afterwards.
      canvas.addEventListener('touchend', function () {
        if (wantsKb() && document.activeElement !== kb) kb.focus({preventScroll: true});
      }, {passive: true});
      (function kbPoll() {
        var want = wantsKb();
        if (want && document.activeElement !== kb) kb.focus({preventScroll: true});
        else if (!want && document.activeElement === kb) { kb.blur(); kbReset(); canvas.focus(); }
        requestAnimationFrame(kbPoll);
      })();
    }
    canvas.focus();
    window.isReady = true;
    status.textContent = '';
    window.dispatchEvent(new CustomEvent('chemgraf-ready'));
  }).catch(function (e) {
    status.textContent = 'the editor could not start: ' + e;
    console.error(e);
  });
})();
</script>
</body>
</html>
